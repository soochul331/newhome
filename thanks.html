<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>감사합니다 · 알부남 신목사</title>
  <meta name="robots" content="noindex">
  <meta name="author" content="알부남 신목사">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --color-bg:#F6F7FB; --color-text:#141B34; --color-border:rgba(20,27,52,.12); --color-text-muted:rgba(20,27,52,.62); }
    body { margin:0; background:var(--color-bg); color:var(--color-text); font:400 17px/1.7 'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif; word-break:keep-all; }
    main { max-width:720px; margin:0 auto; padding:96px 16px; }
    h1 { font:400 40px/1.2 'Black Han Sans','Noto Sans KR',sans-serif; margin:0 0 16px; }
    a.btn { display:inline-block; font:500 13px/1 'Noto Sans KR',sans-serif; letter-spacing:.02em; padding:15px 22px; border-radius:8px; border:1px solid var(--color-border); color:var(--color-text); text-decoration:none; }
    a.btn:hover { border-color:var(--color-text); }
    @media (max-width:768px) { h1 { font-size:32px; } }
  </style>
</head>
<body>
  <main>
    <h1>감사합니다.</h1>
    <p>문의를 잘 받았습니다. 천천히 확인하고 답을 드리겠습니다.</p>
    <p style="color:var(--color-text-muted)">한 걸음씩, 함께 해 보겠습니다.</p>
    <p style="margin-top:32px"><a class="btn" href="/">처음으로 돌아가기</a></p>
  </main>
</body>
</html>
