[build]
  command = "npm run build"
  publish = "_site"
  # 푸시마다 배포하지 않고 하루 1번 예약 배포만 (scripts/netlify-ignore.sh)
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Retired sections send old bookmarks to the official blog.
[[redirects]]
  from = "/newsletter/*"
  to = "https://blog.naver.com/church_ai_lab"
  status = 301
  force = true

[[redirects]]
  from = "/column/*"
  to = "https://blog.naver.com/church_ai_lab"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://blog.naver.com/church_ai_lab"
  status = 301
  force = true
