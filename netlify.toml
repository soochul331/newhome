[build]
  command = "npm run build"
  publish = "_site"
  # 푸시마다 배포하지 않고 하루 1번 예약 배포만 (scripts/netlify-ignore.sh)
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# 2026-10-14: 뉴스레터 → 칼럼 「AI와 교회 사이」 이름·주소 변경. 옛 주소는 새 주소로 보냅니다.
[[redirects]]
  from = "/newsletter/*"
  to = "/column/:splat"
  status = 301
  force = true
