[build]
  command = "npm run build"
  publish = "_site"
  # 푸시마다 배포하지 않고 이틀에 한 번 예약 배포만 (scripts/netlify-ignore.sh)
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 셀라 워십 콘티 앱 (/selah/) — 외부 스크립트·추적기 없이 자체 파일만 쓰는 보안 헤더
[[headers]]
  for = "/selah/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/selah/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/selah/catalog/pack-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/selah"
  to = "/selah/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Retired sections send old bookmarks to the official blog.
[[redirects]]
  from = "/newsletter/*"
  to = "https://blog.naver.com/church_ai_lab"
  status = 301
  force = true

[[redirects]]
  from = "/column/*"
  to = "https://blog.naver.com/church_ai_lab"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://blog.naver.com/church_ai_lab"
  status = 301
  force = true

[[redirects]]
  from = "/sermon-helper/download"
  to = "/assets/downloads/sermon-helper-20261031-v0.1.5.zip"
  status = 302
