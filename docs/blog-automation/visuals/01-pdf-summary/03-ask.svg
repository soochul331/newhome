<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#f7f9fc"/><g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="60" y="56" font-size="22" font-weight="650" fill="#52647f">CHURCH AI LAB  /  PDF 요약 실습</text><text x="940" y="56" font-size="22" font-weight="650" fill="#52647f">3 / 5</text><text x="60" y="131" font-size="44" font-weight="700" fill="#102858">요약과 근거를 함께 요청합니다</text><text x="60" y="181" font-size="26" font-weight="500" fill="#52647f">전체 요청문은 본문과 실습 자료에서 복사할 수 있습니다.</text><rect x="60" y="225" width="870" height="310" rx="12" fill="#eaf0f9" stroke="#ccd8e9" stroke-width="2"/><text x="94" y="290" font-size="30" font-weight="650" fill="#52647f">이렇게 요청해 보세요</text><text x="94" y="356" font-size="34" font-weight="500" fill="#102858">업로드한 문서만 근거로 답해 주세요.</text><text x="94" y="416" font-size="34" font-weight="500" fill="#102858">각 항목에 근거 인용을 붙여 주세요.</text><text x="94" y="476" font-size="32" font-weight="500" fill="#102858">없는 정보는 &#x27;문서에 없음&#x27;으로 표시해 주세요.</text><path d="M60 590H940" stroke="#ccd8e9"/><text x="60" y="624" font-size="22" font-weight="500" fill="#52647f">이해를 돕는 안내 그림 · 실제 제품 화면 캡처가 아닙니다.</text></g></svg>