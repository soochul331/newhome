<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설교준비 도우미 대표 이미지</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #F6F7FB; color: #141B34;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 120px; box-sizing: border-box;
    word-break: keep-all;
  }
  .bar { width: 72px; height: 8px; background: #2747D6; border-radius: 4px; margin-bottom: 44px; }
  h1 { margin: 0; font-size: 104px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  p { margin: 36px 0 0; font-size: 46px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; }
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>설교준비 도우미</h1>
  <p>본문과 묵상에서 원고 초안까지</p>
</body>
</html>
