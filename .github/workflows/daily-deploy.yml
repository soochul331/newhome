name: 홈페이지 배포
on:
  schedule:
    - cron: "30 23 * * *" # 매일 08:30 KST, 기존 예약 배포 시각 유지
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: homepage-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 공개된 네이버 글과 대표 이미지 동기화
        run: python3 scripts/sync-naver-blog.py
      - name: 바뀐 블로그 카드 저장
        run: |
          git add src/_data/blogFeed.json src/media/blog-covers/
          if ! git diff --cached --quiet; then
            git config user.name 'Church AI Lab Blog Sync'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync published Naver blog cards'
            git push origin HEAD:main
          fi
      - name: Netlify 예약 배포 요청
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          test -n "$HOOK"
          curl --fail-with-body --retry 2 -sS -X POST -d '{}' "$HOOK?trigger_title=blog-sync-0830" > /dev/null
          echo "네이버 최신 글을 동기화하고 배포를 요청했습니다."
