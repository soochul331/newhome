                      - label: 자동
                        value: auto
                      - label: 흰색
                        value: light
                      - label: 연한 회색
                        value: parchment
                      - label: 어두운 남색
                        value: dark
                  - label: 질문 한 줄
                    name: quote
                    widget: text
                  - label: 덧붙이는 말
                    name: note
                    widget: text
                    required: false
              - label: 카드 묶음(질문형 제목 + 카드 최대 4개)
                name: cards
                fields:
                  - label: 화면 편집 서식
                    name: appearance
                    widget: visualappearance
                    required: false
                  - label: 앵커 id
                    name: id
                    widget: string
                  - label: 표시
                    name: enabled
                    widget: boolean
                    default: true
                  - label: 글자 크기와 줄 맞춤
                    name: typography
                    widget: object
                    required: false
                    collapsed: true
                    fields:
                      - label: 제목·질문 크기
                        name: title_scale
                        widget: textscale
                        default: 100
                        required: false
                      - label: 설명·본문 크기
                        name: body_scale
                        widget: textscale
                        default: 100
                        required: false
                      - label: 제목·질문 한 줄 자동 맞춤
                        name: auto_fit
                        widget: autofit
                        default: true
                        required: false
                        hint: Enter로 나눈 줄을 유지합니다. 너무 길면 읽을 수 있는 크기를 유지하며 추가 줄바꿈합니다.
                  - label: 구획 색(애플 테마)
                    name: tone
                    widget: select
                    default: auto
                    required: false
                    options:
                      - label: 자동
                        value: auto
                      - label: 흰색
                        value: light
                      - label: 연한 회색
                        value: parchment
                      - label: 어두운 남색
                        value: dark
                  - label: 검색 FAQ에 포함
                    name: faq
                    widget: boolean
                    default: true
                    required: false
                  - label: 소제목(질문형)
                    name: heading
                    widget: text
                    hint: '예: 무엇을 함께 하나요?'
                  - label: 첫 문장 직답
                    name: lead
                    widget: text
                    hint: 첫 문장이 바로 답이어야 합니다.
                  - label: 카드
                    name: items
                    widget: list
                    max: 4
                    summary: '{{fields.title}}'
                    fields:
                      - label: 카드 서식
                        name: appearance
                        widget: visualappearance
                        required: false
                      - label: 단계 표시(제목 위)
                        name: step
