                  - label: 소제목(질문형)
                    name: heading
                    widget: text
                  - label: 첫 문장 직답
                    name: lead
                    widget: text
                  - label: 증거 항목
                    name: items
                    widget: list
                    summary: '{{fields.kind}}'
                    fields:
                      - label: 항목 서식
                        name: appearance
                        widget: visualappearance
                        required: false
                      - label: 구분(경험·결과물·공인·기록)
                        name: kind
                        widget: text
                      - label: 내용(사실만)
                        name: body
                        widget: text
                        hint: 증거표에 없는 경력·수치·수상은 쓰지 않습니다.
                      - label: 링크 글자(본문 안의 단어와 같아야 함)
