backend:
  name: github
  repo: soochul331/newhome
  branch: main
  commit_messages:
    create: '관리자: {{collection}} "{{slug}}" 추가'
    update: '관리자: {{collection}} "{{slug}}" 수정'
    delete: '관리자: {{collection}} "{{slug}}" 삭제'
    uploadMedia: '관리자: 이미지 {{path}} 추가'
    deleteMedia: '관리자: 이미지 {{path}} 삭제'
    openAuthoring: '관리자: {{message}}'
local_backend: true
publish_mode: simple
locale: ko
site_url: https://churchailab.org
display_url: https://churchailab.org
media_folder: src/media
public_folder: /media
collections:
  - name: settings
    label: 사이트 설정
    description: 홈·기본 정보·메뉴를 화면에서 선택해 편집합니다.
    editor:
      preview: false
    files:
      - name: site
        label: 기본 정보
        file: src/_data/site.yml
        fields:
          - label: 화면 편집
            name: _canvas
            widget: visualcanvas
            required: false
            mode: site
            fieldnames:
              - name
              - byline
              - title_tag
              - description
              - url
              - job_title
              - organization
              - alumni
              - keywords
              - links
              - copyright
              - theme
              - og_image
              - og_image_alt
              - appearance
              - homepage_layout
          - label: 사이트 이름(이름 표기)
            name: name
            widget: canvastext
            hint: 홈페이지 상단에 표시할 이름을 입력하세요.
          - label: 바이라인(푸터 첫 줄)
            name: byline
            widget: canvastext
          - label: 브라우저 탭 제목
            name: title_tag
            widget: canvastext
            hint: 30자 안팎, 키워드 하나 포함
          - label: 메타 설명(검색 결과 요약)
            name: description
            widget: canvastext
            hint: 80~110자
          - label: 사이트 주소
            name: url
            widget: canvasstring
          - label: 직함(구조화 데이터용)
            name: job_title
            widget: canvastext
          - label: 소속 기관
            name: organization
            widget: canvastext
          - label: 출신 학교
            name: alumni
            widget: canvastext
          - label: 키워드 3개
            name: keywords
            widget: canvaslist
            field:
              label: 키워드
              name: keyword
              widget: string
          - label: 링크(푸터·소개)
            name: links
            widget: canvaslist
            summary: '{{fields.label}}'
            fields:
              - label: 이름
                name: label
                widget: text
              - label: 주소
                name: url
                widget: string
              - label: 링크 서식
                name: appearance
                widget: visualappearance
                required: false
          - label: 저작권 문구
            name: copyright
            widget: canvastext
          - label: 화면 테마
            name: theme
            widget: canvasselect
            default: beagle
            required: false
            options:
              - label: 기본(브랜드 디자인)
                value: classic
              - label: Apple 스타일
                value: apple
              - label: Tesla 스타일
                value: tesla
              - label: Claude 스타일
                value: claude
              - label: Notion 스타일
                value: notion
              - label: Beagle 스타일
                value: beagle
            hint: 선택하면 오른쪽 미리보기에 반영됩니다. 게시 버튼으로 저장하면 홈페이지에 적용됩니다.
          - label: 링크 공유 이미지(카톡 미리보기)
            name: og_image
            widget: canvasimage
            required: false
            choose_url: true
            hint: 가로 1200 × 세로 630 PNG·JPG 권장. 비우면 기본 이미지(/assets/og.png)를 씁니다. 바꾼 뒤에는 카카오 공유 디버거에서 캐시를 지워야 카톡에 새 이미지가 보입니다.
          - label: 공유 이미지 설명(대체 텍스트)
            name: og_image_alt
            widget: canvastext
            required: false
          - label: 화면 서식
            name: appearance
            widget: canvasvisualappearance
            required: false
          - label: 홈페이지 레이아웃
            name: homepage_layout
            widget: canvasselect
            default: studio
            options:
              - label: 모션 스튜디오
                value: studio
              - label: 기존 테마 레이아웃
                value: classic
      - name: navigation
        label: 메뉴
        file: src/_data/navigation.yml
        fields:
          - label: 화면 편집
            name: _canvas
            widget: visualcanvas
            required: false
            mode: navigation
            fieldnames:
              - items
              - appearance
          - label: 메뉴 항목 (끌어서 순서 변경)
            name: items
            widget: canvaslist
            summary: '{{fields.label}} → {{fields.url}}'
            fields:
              - label: 이름
                name: label
                widget: text
              - label: 링크
                name: url
                widget: string
                hint: 홈 섹션은 /#together 처럼, 페이지는 /lecture/ 처럼, 외부는 https://… 로 씁니다.
              - label: 표시
                name: visible
                widget: boolean
                default: true
              - label: 모바일에서 숨김
                name: hide_on_mobile
                widget: boolean
                default: false
                required: false
              - label: 메뉴 서식
                name: appearance
                widget: visualappearance
                required: false
          - label: 화면 서식
            name: appearance
            widget: canvasvisualappearance
            required: false
      - name: home
        label: 홈 화면
        file: src/_data/home.yml
        fields:
          - label: 화면 편집
            name: _canvas
            widget: visualcanvas
            required: false
            mode: home
            fieldnames:
              - sections
              - appearance
              - studio
              - tools
          - label: 섹션 (끌어서 순서 변경 · 종류별 추가)
            name: sections
            widget: canvaslist
            summary: '{{fields.type}} · {{fields.heading}}{{fields.title}}{{fields.quote}}'
            types:
              - label: 히어로(첫 화면)
                name: hero
                fields:
                  - label: 화면 편집 서식
                    name: appearance
                    widget: visualappearance
                    required: false
                  - label: 앵커 id
                    name: id
                    widget: string
                    default: top
                  - label: 표시
                    name: enabled
                    widget: boolean
                    default: true
                  - label: 글자 크기와 줄 맞춤
                    name: typography
                    widget: object
                    required: false
                    collapsed: true
                    fields:
                      - label: 제목·질문 크기
                        name: title_scale
                        widget: textscale
                        default: 100
                        required: false
                      - label: 설명·본문 크기
                        name: body_scale
                        widget: textscale
                        default: 100
                        required: false
                      - label: 제목·질문 한 줄 자동 맞춤
                        name: auto_fit
                        widget: autofit
                        default: true
                        required: false
                        hint: Enter로 나눈 줄을 유지합니다. 너무 길면 읽을 수 있는 크기를 유지하며 추가 줄바꿈합니다.
                  - label: 구획 색(애플 테마)
                    name: tone
                    widget: select
                    default: auto
                    required: false
                    options:
                      - label: 자동
                        value: auto
                      - label: 흰색
                        value: light
                      - label: 연한 회색
                        value: parchment
                      - label: 어두운 남색
                        value: dark
                  - label: 작은 라벨
                    name: label
                    widget: text
                    required: false
                  - label: 큰 제목(H1)
                    name: title
                    widget: text
                    hint: 첫 화면에서 누구를 위한 어떤 서비스인지 짧게 설명합니다.
                  - label: 부제
                    name: lead
                    widget: text
                    required: false
                  - label: 주 버튼(강조색, 한 화면에 하나)
                    name: primary
                    widget: object
                    required: false
                    fields:
                      - label: 글자
                        name: label
                        widget: text
                        required: false
                        hint: 동사로 끝나는 존댓말. 느낌표 금지
                      - label: 링크
                        name: url
                        widget: string
                        required: false
                  - label: 보조 버튼
                    name: secondary
                    widget: object
                    required: false
                    fields:
                      - label: 글자
                        name: label
                        widget: text
                        required: false
                      - label: 링크
                        name: url
                        widget: string
                        required: false
                  - label: 첫 화면 활용 예시 (Beagle 테마)
                    name: showcase
                    widget: list
                    required: false
                    summary: '{{fields.label}}'
                    fields:
                      - label: 탭 이름
                        name: label
                        widget: string
                      - label: 예시 제목
                        name: title
                        widget: text
                      - label: 설명
                        name: brief
                        widget: text
                      - label: 진행 단계
                        name: stages
                        widget: list
                        field:
                          label: 단계
                          name: stage
                          widget: string
              - label: 나만의 질문
                name: question
                fields:
                  - label: 화면 편집 서식
                    name: appearance
                    widget: visualappearance
                    required: false
                  - label: 앵커 id
                    name: id
