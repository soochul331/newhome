  - name: pages
    identifier_field: title
    editor:
      preview: false
    label: 페이지
    label_singular: 페이지
    description: 강의 안내, 자료실처럼 홈 외의 페이지를 만듭니다. 메뉴에 넣으려면 "메뉴"에서 링크를 추가하세요.
    folder: src/pages
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} ({{permalink}})'
    fields:
      - label: 화면 편집
        name: _canvas
        widget: visualcanvas
        required: false
        mode: pages
        fieldnames:
          - title
          - permalink
          - description
          - body
          - typography
          - appearance
          - layout
          - studio_page
      - label: 제목
        name: title
        widget: canvastext
      - label: 주소(permalink)
        name: permalink
        widget: canvasstring
        hint: '영문 소문자와 하이픈, 앞뒤에 슬래시. 예: /lecture/'
        pattern:
          - ^/[a-z0-9-]+/$
          - '형식: /영문소문자-하이픈/ 예) /lecture/'
      - label: 메타 설명
        name: description
        widget: canvastext
        hint: 80~110자
      - label: 본문
        name: body
        widget: canvasmarkdown
      - label: 글자 크기와 줄 맞춤
        name: typography
        widget: canvasobject
        required: false
        collapsed: true
        fields:
          - label: 제목·질문 크기
            name: title_scale
            widget: textscale
            default: 100
            required: false
          - label: 설명·본문 크기
            name: body_scale
            widget: textscale
            default: 100
            required: false
          - label: 제목·질문 한 줄 자동 맞춤
            name: auto_fit
            widget: autofit
            default: true
            required: false
            hint: Enter로 나눈 줄을 유지합니다. 너무 길면 읽을 수 있는 크기를 유지하며 추가 줄바꿈합니다.
      - label: 화면 서식
        name: appearance
        widget: canvasvisualappearance
        required: false
      - label: 레이아웃
        name: layout
        widget: canvastext
        default: page.njk
        required: false
      - label: 스튜디오 소개 페이지
        name: studio_page
        widget: canvasboolean
        default: false
        required: false
  - name: posts
    identifier_field: title
    editor:
      preview: false
    label: 글·소식
    label_singular: 글
    description: 홈 "최근 글"에 보이는 항목입니다. 네이버 블로그 글이면 링크만, 직접 쓰는 글이면 본문을 채웁니다.
    folder: src/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{fields.date}}-{{slug}}'
    summary: '{{date}} · {{title}}'
    sortable_fields:
      - date
      - title
    fields:
      - label: 화면 편집
        name: _canvas
        widget: visualcanvas
        required: false
        mode: posts
        fieldnames:
          - title
          - date
          - external_url
          - summary
          - body
          - typography
          - appearance
      - label: 제목
        name: title
        widget: canvastext
      - label: 날짜
        name: date
        widget: canvasdatetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: 외부 링크(네이버 블로그 글 주소)
        name: external_url
        widget: canvasstring
        required: false
        hint: 있으면 제목을 누를 때 이 주소로 갑니다. 없으면 아래 본문으로 페이지가 만들어집니다.
      - label: 요약 한 줄
        name: summary
        widget: canvastext
        required: false
      - label: 본문(직접 쓰는 글일 때)
        name: body
        widget: canvasmarkdown
        required: false
      - label: 글자 크기와 줄 맞춤
        name: typography
        widget: canvasobject
        required: false
        collapsed: true
        fields:
          - label: 제목·질문 크기
            name: title_scale
            widget: textscale
            default: 100
            required: false
          - label: 설명·본문 크기
            name: body_scale
            widget: textscale
            default: 100
            required: false
          - label: 제목·질문 한 줄 자동 맞춤
            name: auto_fit
            widget: autofit
            default: true
            required: false
            hint: Enter로 나눈 줄을 유지합니다. 너무 길면 읽을 수 있는 크기를 유지하며 추가 줄바꿈합니다.
      - label: 화면 서식
        name: appearance
        widget: canvasvisualappearance
        required: false

  - name: newsletters
    label: 뉴스레터
    label_singular: 뉴스레터
    description: 뉴스레터 게시판에 올릴 글을 작성합니다. 공개를 끄면 홈페이지에 노출되지 않습니다.
    folder: src/newsletters
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'newsletter/{{slug}}'
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      - {label: 제목, name: title, widget: string}
      - label: 발행일
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - {label: 공개, name: published, widget: boolean, default: true}
      - {label: 요약, name: summary, widget: text, hint: 목록과 공유 미리보기에 표시할 짧은 소개입니다.}
      - {label: 대표 이미지, name: cover, widget: image, required: false}
      - {label: 이미지 설명, name: cover_alt, widget: string, required: false}
      - {label: 본문, name: body, widget: markdown}
