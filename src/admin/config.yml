                    default: question
                  - label: 표시
                    name: enabled
                    widget: boolean
                    default: true
                  - label: 글자 크기와 줄 맞춤
                    name: typography
                    widget: object
                    required: false
                    collapsed: true
                    fields:
                      - label: 제목·질문 크기
