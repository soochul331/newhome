                      - label: 어두운 남색
                        value: dark
                  - label: 소제목(질문형)
                    name: heading
                    widget: text
                  - label: 첫 문장 직답
                    name: lead
                    widget: text
                    required: false
                  - label: 문의 양식 표시
                    name: form_enabled
                    widget: boolean
                    default: true
                  - label: 마무리 말
                    name: closing
                    widget: text
                    default: 끝까지 읽어 주셔서 감사합니다.
              - label: 이미지 구획
                name: image
                fields:
                  - label: 화면 편집 서식
                    name: appearance
                    widget: visualappearance
                    required: false
                  - label: 앵커 id
                    name: id
                    widget: string
                    default: image
                  - label: 표시
                    name: enabled
                    widget: boolean
                    default: true
                  - label: 제목
                    name: heading
                    widget: text
                    required: false
                  - label: 이미지
                    name: src
                    widget: image
                    choose_url: true
                  - label: 이미지 설명(대체 텍스트)
                    name: alt
                    widget: string
