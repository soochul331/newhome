sections:
  - type: hero
    id: top
    enabled: true
    label: 목회자를 위한 AI 활용 교육
    title: |-
      AI를 사역에 쓰는 법,
      함께 배웁니다.
    lead: |-
      설교준비, 목회행정, 교회교육, 나만의 AI 도구까지.
      지금 필요한 사역부터 AI를 활용하는 방법을 함께 연습합니다.
    primary:
      label: 강의·컨설팅 문의하기
      url: '#contact'
    secondary:
      label: 활용 과정 살펴보기
      url: '#for-whom'
    showcase:
      - label: 설교준비
        title: 설교의 흐름을 정리하고 전달을 준비합니다.
        brief: 본문을 읽으며 정리한 묵상을 바탕으로 설교의 흐름을 살펴봅니다. 예화와 적용 질문, 발표 자료의 초안을 만들고 직접 확인하며 다듬습니다.
        stages:
          - 본문·묵상 정리하기
          - 흐름과 적용 구성하기
          - 내용 확인·다듬기
      - label: 목회행정
        title: 반복되는 행정 업무를 차근차근 정리합니다.
        brief: 주보 안내문, 회의록, 행사 계획의 초안을 준비합니다. 필요한 항목을 정리하고 우리 교회의 일정과 상황에 맞게 다듬습니다.
        stages:
          - 업무·필요 항목 정하기
          - 문서 초안 작성하기
          - 일정·내용 확인하기
      - label: 교회교육
        title: 대상과 주제에 맞는 교육 자료를 만듭니다.
        brief: 주일학교 예배 및 소그룹 모임의 대상과 주제를 정하고 활동과 나눔 질문을 구성합니다. AI의 초안을 검토해 우리 교회에서 사용할 예배 및 모임 자료로 다듬습니다.
        stages:
          - 대상·주제 정하기
          - 활동·나눔 구성하기
          - 예배·모임 자료 다듬기
      - label: 나만의 AI 도구
        title: 내 사역의 방식에 맞는 AI 도구를 만듭니다.
        brief: 자주 하는 일의 순서와 기준을 정리합니다. 반복해서 활용할 질문과 작업 흐름을 묶어 내 사역을 돕는 AI 도구로 만들어 갑니다.
        stages:
          - 반복할 작업 고르기
          - 순서·기준 정리하기
          - 도구 만들고 점검하기
  - type: cards
    id: together
    enabled: true
    faq: true
    heading: 내 사역에 어떻게 활용하나요?
    lead: 설교준비·목회행정·교회교육·나만의 AI 도구, 네 가지 영역에서 실제로 활용하는 방법을 함께합니다.
    items:
      - title: 설교준비
        body: 본문을 읽으며 정리한 묵상을 바탕으로 설교의 흐름을 살펴봅니다. 예화와 적용 질문, 발표 자료의 초안을 만들고 직접 확인하며 다듬습니다.
      - title: 목회행정
        body: 주보 안내문, 회의록, 행사 계획의 초안을 준비합니다. 필요한 항목을 정리하고 우리 교회의 일정과 상황에 맞게 다듬습니다.
      - title: 교회교육
        body: 주일학교 예배 및 소그룹 모임의 대상과 주제를 정하고 활동과 나눔 질문을 구성합니다. AI의 초안을 검토해 우리 교회에서 사용할 예배 및 모임 자료로 다듬습니다.
      - title: 나만의 AI 도구
        body: 자주 하는 일의 순서와 기준을 정리합니다. 반복해서 활용할 질문과 작업 흐름을 묶어 내 사역을 돕는 AI 도구로 만들어 갑니다.
  - type: cards
    id: for-whom
    enabled: true
    faq: true
    heading: 어디서부터 시작하면 될까요?
    lead: 네 가지 활용 영역 중 필요한 일을 고르고, 질문부터 결과물을 다듬는 과정까지 한 단계씩 함께합니다.
    items:
      - step: 1단계 · 활용할 일 찾기
        title: 어떤 일에 쓸까요?
        body: 설교준비, 목회행정, 교회교육, 나만의 AI 도구 중 지금 필요한 일을 고릅니다.
      - step: 2단계 · 질문하기
        title: 어떻게 질문할까요?
        body: 대상과 목적, 필요한 형식을 담아 원하는 결과를 요청합니다.
      - step: 3단계 · 자료 만들기
        title: 어떻게 다듬을까요?
        body: AI의 답변을 확인하고 설교 준비 메모, 행정 문서, 교육 자료 등 실제로 쓸 결과물로 다듬습니다.
      - step: 4단계 · 나만의 도구
        title: 어떻게 계속 쓸까요?
        body: 반복할 작업의 순서를 정리하고 나만의 AI 도구로 만듭니다.
  - type: question
    id: question
    enabled: true
    quote: |-
      막연하게 배우기보다,
      내 사역에 필요한 것부터.
    note: |-
      준비 중인 설교, 행정 업무, 교육 계획을 가져오세요.
      나만의 AI 도구로 만들고 싶은 작업도 함께 살펴봅니다.
    typography:
      title_scale: 100
      body_scale: 95
  - type: richtext
    id: tools
    enabled: true
    heading: 직접 만든 AI도구
    body: |-
      <p>주일의 말씀을, 일상의 숏츠로. 설교의 핵심 메시지를 세로(숏츠) 영상으로 나누는 설교 숏츠 제작기를 직접 만들었습니다.</p>
      <p>교회 유튜브의 설교 영상을 불러오면 AI가 핵심 메시지를 분석해 숏츠로 만들 구간을 제안합니다. 목회자가 구간을 고르고 제목과 자막을 확인하면, 교회 이름이 들어간 세로(숏츠) 영상이 됩니다. 지금은 Church AI Lab과 함께하는 초대받은 교회에서 사용하며, 무료 체험은 숏츠 1편입니다.</p>
      <p class="actions"><a class="btn btn-primary" href="/sermon-shorts/">설교 숏츠 제작기 소개 보기</a> <a class="btn btn-secondary" href="https://sermonshorts.churchailab.org">도구 열기 <span aria-hidden="true">↗</span></a></p>
  - type: evidence
    id: about
    enabled: true
    faq: true
    heading: 누가 함께하나요?
    lead: |-
      목회AI 컨설턴트 신수철 목사입니다.
      목회 현장에서 사역하며 설교준비·목회행정·교회교육에 AI를 활용하는 방법과 도구를 연구하고 나눕니다.
    items:
      - kind: 소속 · 교회교육
        body: 교회교육훈련개발원 소속 연구원으로 활동하고 있습니다.
        link_label: 교회교육훈련개발원
        link_url: http://www.cetnd.org/default/01/06.php
      - kind: 소속 · AI 연구
        body: KACI(한국AI융합연구원) 소속 AI 연구원으로 활동하고 있습니다.
        link_label: KACI(한국AI융합연구원)
        link_url: https://www.kaci.ai.kr/
      - kind: 사역 경험
        body: 실제 사역 현장에서 교육목사로 중고등부를 담당하고 있습니다.
      - kind: 학업
        body: G.C.U(Georgia Central University)에서 AI융합 박사과정을 수강 중입니다. 배운 내용을 실제 사역 자료와 도구에 적용하고 있습니다.
      - kind: 직접 만든 도구
        body: 설교·강의 PPT 디자인 스킬, 발표자 노트 자동 생성 스킬, 설교 영상의 핵심 메시지를 분석해 숏츠로 만드는 설교 숏츠 제작기를 만들었습니다. 직접 쓰며 익힌 활용법을 나눕니다.
        link_label: 설교 숏츠 제작기
        link_url: /sermon-shorts/
      - kind: 기록
        body: 처치AI랩 네이버 블로그에 교회를 위한 AI 연구와 활용 자료를 나눕니다.
        link_label: 처치AI랩 네이버 블로그
        link_url: https://blog.naver.com/church_ai_lab
  - type: posts
    id: posts
    enabled: true
    heading: 어떤 자료를 나누고 있나요?
    lead: 설교준비, 목회행정, 교회교육과 AI 도구를 활용하며 배운 내용을 블로그에 기록합니다.
    count: 3
    more_label: 활용 글 더 보기
    more_url: https://blog.naver.com/church_ai_lab
  - type: contact
    id: contact
    enabled: true
    heading: 우리 교회에도 적용해 볼까요?
    lead: |-
      설교준비·목회행정·교회교육·나만의 AI 도구에 관한 강의와 컨설팅을 문의해 주세요.
      교육 대상과 도움이 필요한 업무를 남겨 주시면 확인하고 답을 드립니다.
    form_enabled: true
    closing: 한 걸음씩 함께 만들어 가겠습니다. 감사합니다.
