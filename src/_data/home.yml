sections:
  - type: hero
    id: top
    enabled: true
    label: 목회자를 위한 AI 활용 교육
    title: |-
      AI를 사역에 쓰는 법,
      함께 배웁니다.
    lead: |-
      교회교육 자료와 강의 준비부터 반복 업무까지.
      우리 교회에 필요한 자료와 도구를 직접 만드는 과정을 함께 연습합니다.
    primary:
      label: 강의·컨설팅 문의하기
      url: '#contact'
    secondary:
      label: 활용 과정 살펴보기
      url: '#for-whom'
    showcase:
      - label: 교회교육 자료
        title: 우리 교회에 맞는 교육 자료
        brief: 대상과 주제를 담아 질문하고, AI의 초안을 수업에 맞게 다듬습니다.
        stages:
          - 대상·주제 정하기
          - 교육안 초안 만들기
          - 내용 확인·수정하기
      - label: 설교·강의 준비
        title: 전달할 내용이 보이는 발표 자료
        brief: 핵심 내용을 정리해 발표 자료와 발표자 노트로 연결합니다.
        stages:
          - 핵심 내용 정리하기
          - 발표 자료 구성하기
          - 발표자 노트 다듬기
      - label: 나만의 AI 도구
        title: 반복되는 준비를 돕는 AI 도구
        brief: 자주 하는 일의 순서와 기준을 정리해 사역에 맞는 도구로 만듭니다.
        stages:
          - 반복 업무 고르기
          - 진행 순서 정리하기
          - 도구 만들고 점검하기
  - type: cards
    id: together
    enabled: true
    faq: true
    heading: 내 사역에 어떻게 활용하나요?
    lead: 배운 내용을 교육 자료와 발표 자료, 반복 업무를 돕는 도구로 연결합니다.
    items:
      - title: 교회교육 자료 만들기
        body: 교육 대상과 주제에 맞게 질문합니다. AI의 초안을 검토하고 우리 교회의 수업 자료로 다듬습니다.
      - title: 설교·강의 준비에 활용하기
        body: 핵심 내용을 정리하고 발표 자료를 구성합니다. 발표자 노트까지 이어서 준비하는 방법을 연습합니다.
      - title: 반복 업무를 돕는 도구 만들기
        body: 자주 하는 일의 순서와 기준을 정리합니다. 필요한 작업을 돕는 나만의 AI 도구로 연결합니다.
  - type: cards
    id: for-whom
    enabled: true
    faq: true
    heading: 어디서부터 시작하면 될까요?
    lead: 기초 질문부터 실제 자료와 도구를 만드는 과정까지, 한 단계씩 함께합니다.
    items:
      - step: 1단계 · 활용할 일 찾기
        title: 어떤 일에 쓸까요?
        body: 교육 자료, 강의 준비, 반복 업무 중 AI로 도울 일을 고릅니다.
      - step: 2단계 · 질문하기
        title: 어떻게 질문할까요?
        body: 대상과 목적, 필요한 형식을 담아 원하는 결과를 요청합니다.
      - step: 3단계 · 자료 만들기
        title: 어떻게 다듬을까요?
        body: AI의 답변을 확인하고 교육 자료와 발표 자료로 완성해 갑니다.
      - step: 4단계 · 나만의 도구
        title: 어떻게 계속 쓸까요?
        body: 반복할 작업의 순서를 정리하고 나만의 AI 도구로 만듭니다.
  - type: question
    id: question
    enabled: true
    quote: |-
      막연하게 배우기보다,
      내 사역에 필요한 것부터.
    note: |-
      준비 중인 교육이나 강의, 반복되는 업무를 가져오세요.
      지금 필요한 작업을 중심으로 AI 활용법을 함께 찾습니다.
    typography:
      title_scale: 100
      body_scale: 95
  - type: richtext
    id: sermon-shorts
    enabled: true
    heading: 설교 한 대목을 짧은 영상으로 나눌 수 있나요?
    body: |-
      <p>나눌 수 있습니다. 그 일을 돕는 도구, 설교shorts제작기를 직접 만들었습니다.</p>
      <p>교회 유튜브에 올린 설교 영상을 불러오면 AI가 짧게 나누기 좋은 대목을 짚어 줍니다. 목회자가 대목을 고르고 제목과 자막을 확인하면, 교회 이름이 들어간 세로 영상이 됩니다. 지금은 함께하는 교회에서 먼저 쓰고 있습니다.</p>
      <p class="actions"><a class="btn btn-primary" href="/sermon-shorts/">설교shorts제작기 소개 보기</a> <a class="btn btn-secondary" href="https://sermonshorts.churchailab.org">도구 열기 <span aria-hidden="true">↗</span></a></p>
  - type: evidence
    id: about
    enabled: true
    faq: true
    heading: 누가 함께하나요?
    lead: |-
      교회AI 컨설턴트 신수철 목사입니다.
      교회교육 현장에서 사역하며 목회자를 위한 AI 도구를 직접 만들고 있습니다.
    items:
      - kind: 경험
        body: 늘푸른진건교회 교육목사로 중고등부와 소망교구를 맡고 있습니다. 교회교육 현장의 필요를 바탕으로 함께합니다.
        link_label: 늘푸른진건교회
        link_url: http://www.egjingeon.com/
      - kind: 직접 만든 도구
        body: 설교·강의 PPT 디자인 스킬, 발표자 노트 자동 생성 스킬, 설교 영상으로 쇼츠를 만드는 설교shorts제작기를 만들었습니다. 직접 쓰며 익힌 활용법을 나눕니다.
        link_label: 설교shorts제작기
        link_url: /sermon-shorts/
      - kind: 연구
        body: AI융합 박사과정에 재학 중입니다. 배운 내용을 실제 사역 자료와 도구에 적용하고 있습니다.
      - kind: 기록
        body: 처치AI랩 네이버 블로그에 교회를 위한 AI 연구와 활용 자료를 나눕니다.
        link_label: 처치AI랩 네이버 블로그
        link_url: https://blog.naver.com/church_ai_lab
  - type: posts
    id: posts
    enabled: true
    heading: 어떤 자료를 나누고 있나요?
    lead: 교회에서 AI를 활용하며 배운 내용을 블로그에 기록합니다.
    count: 3
    more_label: 활용 글 더 보기
    more_url: https://blog.naver.com/church_ai_lab
  - type: contact
    id: contact
    enabled: true
    heading: 우리 교회에도 적용해 볼까요?
    lead: |-
      강의·교육 세미나·AI 활용 컨설팅을 문의해 주세요.
      도움이 필요한 사역과 배우고 싶은 내용을 남겨 주시면 확인하고 답을 드립니다.
    form_enabled: true
    closing: 한 걸음씩 함께 만들어 가겠습니다. 감사합니다.
