sections:
  - type: hero
    id: top
    enabled: true
    label: ""
    title: |-
      목회자를 위한 AI활용법을 함께 나누고,
      교회의 AX(AI Transformation, 인공지능 전환)시대를 준비합니다.
    lead: |-
      교회교육현장의 목회자이자 AI를 연구하는 사람으로 일하고 있습니다.
      교회사역에 AI를 어떻게 적용할지 고민하는 분들 곁에서,
      사역에 맞는 활용법을 함께 찾겠습니다.
    primary:
      label: 문의하기
      url: "#contact"
    secondary:
      label: 함께 하는 일 보기
      url: "#together"
  - type: question
    id: question
    enabled: true
    quote: AI 시대, 교회는 무엇을 맡기고 무엇을 지켜야 할까요?
    note: |-
      AI에게 맡길 일과 사람이 책임져야 하는 일들을 신학적인 관점에서 분별합니다.
      강의와 컨설팅, 온라인 플랫폼을 통해 교회 행정과 목회사역 안에서의 올바른 AI활용법을 나눕니다.
      교회가 교회답고, 목회자가 목회자답게 사역하도록 스스로 지켜야 할 윤리적 기준도 함께 살핍니다.
    typography:
      title_scale: 100
      body_scale: 95
  - type: cards
    id: for-whom
    enabled: true
    faq: true
    heading: 혹시, 이런 고민을 하고 계신가요?
    lead: |-
      AI를 사용하고 있지만 어떻게 써야 할지 모르겠다면, 잘 찾아오셨습니다.
      기본 단계의 활용에 머물러 있어도 괜찮습니다.
      천천히 하나씩 경험하며 나만의 AI 에이전트를 만들어 갑니다.
    items:
      - title: AI에 무엇을 맡겨도 될까요?
        body: 설교 준비와 목회사역에서 AI가 도울 수 있는 일과 목회자가 직접 판단하고 책임져야 할 일을 함께 살펴봅니다.
        step: 1단계 · 분별과 책임
      - title: 묻고 답을 받는 데서 멈추나요?
        body: AI에 무엇을 어떻게 물어야 할지 막막하다면, 사역의 목적과 상황을 담아 질문하는 방법부터 익힙니다.
        step: 2단계 · 질문의 기초
      - title: 답변을 사역에 어떻게 활용할까요?
        body: AI의 답변을 검토하고 다듬어, 우리 교회에 맞는 교육 자료와 발표 자료로 만드는 과정을 함께 연습합니다.
        step: 3단계 · 실제 활용
      - typography:
          title_scale: 100
          body_scale: 100
          auto_fit: true
        step: 4단계 · 나만의 도구
        title: 내 사역에 맞는 AI를 만들 수 있을까요?
        body: 자주 하는 일의 순서와 기준을 정리해, 목회자의 검토 아래 반복되는 사역 준비를 돕는 나만의 AI 에이전트를 만들어 갑니다.
  - type: cards
    id: together
    enabled: true
    faq: true
    heading: 무엇을 함께 하나요?
    lead: 신학적 분별, 현장 실습, 온라인 활동 세 가지를 함께합니다. 셋 중 하나만 있으면 두려움은 풀리지 않습니다. 한 걸음씩 함께 해
      보겠습니다.
    items:
      - title: 신학적 분별
        body: 무엇을 AI에 맡기고 무엇을 맡기지 않을지 먼저 정합니다. AI는 생각하지 않고 생성합니다. 그 경계를 성경과 신학의 눈으로 함께
          봅니다.
      - title: 현장 실습
        body: 설교 준비, 교육 자료, 발표 자료를 실제 사역 자료로 직접 해 봅니다. 제가 만든 목회자용 AI 도구를 그 자리에서 함께 씁니다.
      - title: 온라인 활동
        body: 강의가 끝나도 이어집니다. 처치AI랩 블로그에 연구와 자료를 나누고, 질문을 받습니다.
  - type: evidence
    id: about
    enabled: true
    faq: true
    heading: 신수철 목사는 누구인가요?
    lead: 늘푸른진건교회 교육목사이자, 교회를 위한 AI 도구를 직접 만드는 교회AI 컨설턴트입니다. 교회사역에 AI를 접목하는 일을 돕는
      사람으로서, 최종적으로는 교회의 AX(AI 전환) 시대를 준비하고 싶습니다.
    items:
      - kind: 경험
        body: 늘푸른진건교회 교육목사로 중고등부와 80대 이상 소망교구를 맡고 있습니다. 청소년 사역은 15년 이상 이어 왔습니다. 그래서
          교회교육의 현장을 압니다.
        link_label: 늘푸른진건교회
        link_url: http://www.egjingeon.com/
      - kind: 결과물
        body: 목회자용 AI 도구를 직접 만들었습니다. 설교·강의 PPT 디자인 스킬과 발표자 노트 자동 생성 스킬입니다. 써 보고 말씀드립니다.
      - kind: 공인
        body: 대한예수교장로회(합동) 목사이며, 총신대학교 신학대학원 M.Div.를 마쳤습니다. 지금은 AI융합 박사과정에 재학 중입니다. 신학과
          AI를 한 자리에서 공부합니다.
      - kind: 기록
        body: 처치AI랩 네이버 블로그에 교회를 위한 AI 연구와 자료를 나누고 있습니다. 과정이 공개되어 있습니다.
        link_label: 처치AI랩 네이버 블로그
        link_url: https://blog.naver.com/church_ai_lab
  - type: posts
    id: posts
    enabled: true
    heading: 최근에는 어떤 글을 썼나요?
    lead: 처치AI랩 블로그에 교회를 위한 AI 연구와 자료를 나누고 있습니다.
    count: 3
    more_label: 블로그 가기
    more_url: https://blog.naver.com/church_ai_lab
  - type: contact
    id: contact
    enabled: true
    heading: 어떻게 연락하나요?
    lead: 아래에 문의를 남겨 주시면 확인하고 답을 드립니다. 강의, 교회 교육 세미나, 함께 공부하고 싶은 주제 모두 괜찮습니다.
    form_enabled: true
    closing: 끝까지 읽어 주셔서 감사합니다.
